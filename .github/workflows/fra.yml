name: Gulf agencies
on:
  workflow_dispatch:
  schedule:
    - cron: "47 20 * * *"
permissions:
  contents: read
concurrency:
  group: gulf-agencies
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_fra
      - run: python fra.py
        env:
          FRA_TARGET: "500"
          WORKERS: "6"
          CRAWL_DELAY: "0.5"
          MAX_SECONDS: "16000"
