name: No website leads
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nowebsite
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nowebsite.py
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          TARGET: "300"
          WORKERS: "3"
          MAX_SECONDS: "20000"
